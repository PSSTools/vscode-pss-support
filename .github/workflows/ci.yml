# CI for psstools/vscode-pss-support.
#
# THE ONLY VS CODE MARKETPLACE PUBLISHER IN THE ESTATE, and the reason this
# repository is the first one converted in Phase 9. A Marketplace version is
# less recoverable than a PyPI one: PyPI lets a version be yanked, so a
# mistaken release can at least be hidden. The Marketplace has no yank -- an
# extension version, once accepted, is what users on that channel receive.
#
# Before this commit `vsce publish` was conditional on a push to master. This
# repository is about to join a five-minute bidirectional mirror, where "a push
# to master" is something a cron performs on someone else's commit. A mirror
# operation must never be a publishing operation, which is the rule this whole
# migration exists to establish.

name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------- #
  # The release-authority master switch. Resolved in its OWN job because an
  # `if:` on a job cannot reference a step in that same job, so the value has
  # to arrive through `needs.<job>.outputs`.
  #
  # A consumer that reads needs.gate.outputs WITHOUT declaring `needs: gate`
  # gets an EMPTY STRING rather than an error -- the publish condition is then
  # false forever, nothing publishes, and nothing goes red. That is the
  # quietest failure available here, so the shadow check in
  # .forgejo/workflows/ci.yml asserts the wiring explicitly.
  # ---------------------------------------------------------------------- #
  gate:
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # The python is ONE LINE on purpose: a multi-line `python3 -c` body has
        # to start at column 0, which terminates the YAML block scalar above it
        # and silently corrupts the workflow rather than failing to parse.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            # FAIL CLOSED WHEN A RELEASE COULD ACTUALLY HAPPEN, and quietly
            # otherwise. In this org a release is a `v*` TAG, so that -- not
            # the event name -- is the test. Keying on the event name would be
            # wrong in both directions: a tag push IS a push, so it would let a
            # release through unresolved, and every ordinary push would then
            # also be treated as release-critical and fail the build.
            #
            # A release blocked by a dvkit.org outage is recoverable in ten
            # minutes. A version published twice from two forges is not: PyPI
            # lets a version be yanked, never reused, and the VS Code
            # Marketplace does not even allow the yank.
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
              *)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable, and this ref cannot release; continuing"
                exit 0 ;;
            esac
          fi
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------- #
  # THE PARSER IS BUILT, NOT GENERATED, and it is built once here.
  #
  # This job replaced one called `generate`, which ran ANTLR over src/PSS*.g4
  # to emit a TypeScript lexer and parser into server/src/generated/. There is
  # no ANTLR front end in this repository any more: the server parses through
  # @psstools/pssparser -- the pssparser C++ core compiled to WebAssembly --
  # and the grammar, the generation and the ANTLR dependency are all upstream's
  # now. `npm run generate` no longer exists in any manifest here.
  #
  # ivpm fetches pssparser as a source dependency and npm's `prepare` hook in
  # its ts/ directory drives cmake, Emscripten and tsc to produce dist/. No
  # pssparser version is pinned, deliberately: an upstream change that breaks
  # this repository SHOULD turn this red, which is the same reasoning the
  # generate job was written under and the reason it is a build and not a
  # vendored blob.
  #
  # Built once and shared as an artifact because that build is expensive: an
  # ivpm fetch, a JDK, the Emscripten toolchain and a C++ compile. Four jobs
  # consume it and three deliberately do not -- see the note above `lint`
  # below for which, and why that is decided by what a job resolves rather
  # than by what it installs.
  # ---------------------------------------------------------------------- #
  build-parser:
    name: Build the pssparser WebAssembly package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ivpm
        run: pip install ivpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java (pssparser's C++ front end is generated by ANTLR)
        # Still a JVM here, and only here. The ANTLR that runs is upstream's,
        # over upstream's grammar, emitting C++ that goes into the wasm -- not
        # the TypeScript parser this repository used to generate for itself.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      # `-a` is anonymous auth. The runner holds no credential for ivpm's
      # default ['gh', 'ssh'] order, and ssh against the public mirror hangs
      # rather than failing, so without this the job times out instead of
      # erroring.
      #
      # This one command is the parser build: ivpm installs pssparser's ts/
      # into the managed node environment as a `file:` dependency, and npm runs
      # `prepare` on it. There is no separate build step to add here, and
      # adding one would be a second way to do it.
      - name: Fetch pssparser and build it
        run: ivpm update -a -d default-dev -j 1
      - name: Check the parser actually built
        # The wasm binary is the thing that cannot be faked by a partial build:
        # tsc will happily emit dist/*.js from the TypeScript wrapper alone,
        # so a cmake failure that `prepare` somehow let through would leave a
        # dist/ that looks complete and throws at the first parse. Load it and
        # parse something rather than trusting the file listing.
        run: |
          wasm=packages/pssparser/ts/dist/wasm/pssparser.wasm
          test -s "$wasm" || { echo "::error::no wasm at $wasm"; exit 1; }
          echo "wasm: $(wc -c < "$wasm") bytes"
          node --input-type=module -e '
            import { createParser } from "./packages/pssparser/ts/dist/index.js";
            const p = await createParser();
            p.parseSources([{ name: "ci.pss", content: "component c { action a {} }" }]);
            p.link();
            const errs = p.markers.filter((m) => m.severity === "error");
            if (errs.length) { console.error(`::error::${errs[0].message}`); process.exit(1); }
            if (p.userUnits().length !== 1) { console.error("::error::no units"); process.exit(1); }
            p.dispose();
            console.log("parser loads, parses and links");
          '
      - uses: actions/upload-artifact@v4
        with:
          name: pssparser-wasm
          # dist/ and package.json are the package; scripts/ is here because
          # npm runs `prepare` on a `file:` dependency at every install and
          # invokes it by path -- with scripts/ missing the consumer's
          # `npm install` dies on MODULE_NOT_FOUND before any guard inside the
          # script can decline to run. With it present, prepare.mjs sees no
          # src/ alongside it and exits 0, which is the path it already
          # documents for a consumer installing a prebuilt package.
          path: |
            packages/pssparser/ts/dist/
            packages/pssparser/ts/package.json
            packages/pssparser/ts/scripts/
          if-no-files-found: error
          retention-days: 1

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ivpm
        run: pip install ivpm
      # NODE AND A JDK IN A DOCS JOB. This job wants Sphinx, which arrives in
      # the venv through pssparser; but `ivpm update` also installs pssparser's
      # ts/ and npm runs its `prepare` hook, which compiles the C++ core to
      # WebAssembly. So this job pays for a parser build it will never use, and
      # without a JDK on PATH it fails partway through one.
      #
      # Declared rather than inherited: ubuntu-latest happens to ship both, and
      # a docs job that builds only because of what an image happens to
      # preinstall is a job that breaks on an image refresh, in a place with no
      # obvious connection to the change.
      #
      # The waste is real and is not fixable here -- it needs a dep-set in
      # ivpm.yaml that carries the Python content without the node content.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Fetch packages
        run: ivpm update -a -d default-dev -j 1
      - name: Build HTML docs
        run: packages/python/bin/sphinx-build -W --keep-going docs docs/_build/html
      # THE gh-pages DEPLOY THAT WAS HERE IS GONE, not gated.
      #
      # It fired on every push to master, with no condition beyond the branch,
      # and published to https://psstools.github.io/vscode-pss-support/ . Two
      # reasons it is deleted rather than tag-gated:
      #
      #   1. dvkit.org owns documentation for this estate. Docs are not a
      #      release -- they should publish whichever forge holds release
      #      authority -- so they go out through the Forgejo docs pipeline
      #      (an artifact this job does not hold credentials to deploy),
      #      never through a per-repo Pages site.
      #   2. Per-repo Pages sites are being retired estate-wide. Re-arming
      #      this one on a tag would resurrect a site that is on the list to
      #      be turned off.
      #
      # The Sphinx build above stays, as a CI check. It is now the only thing
      # that would notice these docs breaking, which is why the step below
      # exists: the deploy used to be the de-facto check that the build had
      # produced anything at all.
      - name: Sanity-check the docs build
        run: |
          test -s docs/_build/html/index.html \
            || { echo "::error::no index.html in the docs build output"; exit 1; }
          echo "generated pages: $(find docs/_build/html -name '*.html' | wc -l)"


  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # WAS: a raw `git clone --depth=1` of zuspec/zuspec-fe-pss.
      #
      # That checkout was retired upstream, and it left this job fetching its
      # grammar by a mechanism no other job used: `docs` and `lint` resolve
      # dependencies through ivpm, `build` cloned a URL. Two mechanisms meant
      # they could disagree about which parser source the tree was built from,
      # and after the retirement they did -- ivpm fetched pssparser while this
      # job still generated the parser from the old grammar.
      #
      # ivpm.yaml is now the single declaration of that dependency. `-a` is
      # anonymous auth: the runner holds no credential for the default
      # ['gh', 'ssh'] order, and an ssh attempt against the public mirror hangs
      # rather than failing, so this would time out instead of erroring.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ivpm
        run: pip install ivpm
      - name: Fetch packages
        run: ivpm update -a -d default-dev -j 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java (pssparser's C++ front end is generated by ANTLR)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Install dependencies
        run: npm install
      # THE ONE JOB THAT STILL BUILDS THE PARSER ITSELF rather than downloading
      # `build-parser`'s artifact, and the reason is the same as it was when
      # this job generated its own ANTLR sources: what ships must be built from
      # what was fetched. `vsce package` below walks the tree it is given, and
      # the wasm it packages is whatever sits in packages/pssparser/ts/dist.
      # Sourcing that from another job's artifact would put a second mechanism
      # between the published extension and pssparser, which is exactly the
      # split this job was untangled from once already.
      #
      # `npm run generate` used to sit here. It is gone along with the ANTLR
      # front end; the `ivpm update` above is now the whole of the build, via
      # npm's `prepare` hook in pssparser's ts/.
      - name: Build
        run: npm run compile
      - name: Install vsce
        run: npm install -g @vscode/vsce
      - name: Package extension
        run: vsce package
      - name: Check the tag matches the package version
        # Only on a tag, and BEFORE the publish step, because `vsce publish`
        # takes its version from package.json and ignores the tag entirely.
        # Tagging v0.4.0 while package.json still says 0.3.0 would publish
        # 0.3.0 under the name of a release that is not it -- and, the
        # Marketplace having no yank, that is not correctable afterwards.
        #
        # It CHECKS rather than rewrites, deliberately. A rewrite makes the
        # published artifact differ from the commit it claims to be built
        # from; for an extension shipped to users, the committed version is
        # the thing that should be authoritative.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match version $pkg in package.json"
            exit 1
          fi

      - name: Publish to VS Code Marketplace
        # WAS: `github.event_name == 'push' && github.ref == 'refs/heads/master'`
        #
        # Both halves are required and neither is redundant:
        #
        #   startsWith(github.ref, 'refs/tags/v')  -- a release is a deliberate
        #     tag, never a branch push, so no mirrored commit can trigger one.
        #   needs.gate.outputs.authority == 'github'  -- the master switch at
        #     https://dvkit.org/.well-known/release-authority.json decides
        #     WHICH forge releases this repo. Flipping it in sync-policy.toml
        #     moves the release with no edit to this file.
        #
        # `needs: gate` is declared on the job above. Without it this
        # expression reads an empty string, is false forever, and publishes
        # nothing while going green -- see the note on the gate job.
        if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.authority == 'github' }}
        env:
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VS_MARKETPLACE_PAT is not set for this repository"
            exit 1
          fi
          vsce publish -p "$VSCE_PAT"

  # ---------------------------------------------------------------------- #
  # A JOB THAT NEEDS THE PARSER DOWNLOADS IT BEFORE `npm install`, NOT AFTER,
  # AND A JOB THAT DOES NOT NEED IT DOES NOT DEPEND ON build-parser AT ALL.
  #
  # On the ordering: these jobs used to install first and drop the `generate`
  # artifact into server/src/ afterwards, which was fine while the artifact was
  # TypeScript source -- nothing resolved it until tsc or vitest ran. The
  # parser is a dependency now, named by `file:` path in server/package.json,
  # and npm resolves it during install.
  #
  # On the dependency: note that a MISSING `file:` dependency does not fail the
  # install. npm creates the symlink anyway, dangling, and exits 0 -- so this
  # cannot be decided by "does the job run npm install", which every job does
  # through the root postinstall. It has to be decided by whether anything the
  # job runs resolves the parser:
  #
  #   test-core, test-lsp, test-bench   load the wasm and parse with it
  #   typecheck                         reads dist/*.d.ts through the `file:` link
  #   build                             packages the wasm into the .vsix
  #
  #   lint                              eslint here is NOT type-aware (there is
  #                                     no parserOptions.project in
  #                                     .eslintrc.json), so it never resolves an
  #                                     import
  #   test-client, test-contributions   neither touches server code
  #
  # The three below therefore stay off the critical path, as they were under
  # the generate job. Getting this wrong is cheap in one direction and
  # expensive in the other: an unnecessary `needs: build-parser` makes a
  # thirty-second job wait several minutes on a C++ compile, while a missing
  # one shows up immediately as an unresolved import rather than silently.
  # ---------------------------------------------------------------------- #
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # WAS: setup-python, `pip install ivpm` and a full `ivpm update`, for a
      # parser this job does not lint and cannot see. That fetch now also
      # builds the wasm, so keeping it would have meant a JDK and an
      # Emscripten compile in order to run eslint.
      - run: npm install
      - run: npm run lint

  test-core:
    needs: build-parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the prebuilt parser
        uses: actions/download-artifact@v4
        with:
          name: pssparser-wasm
          path: packages/pssparser/ts
      - run: npm install
      - name: Run core tests
        run: npm run test:core

  test-lsp:
    needs: build-parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the prebuilt parser
        uses: actions/download-artifact@v4
        with:
          name: pssparser-wasm
          path: packages/pssparser/ts
      - run: npm install
      - name: Run LSP tests
        run: npm run test:lsp

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run client tests
        run: npm run test:client

  test-contributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check package.json contributions, snippets, and packaging
        run: npm run test:contrib
      - name: Check TextMate grammar scopes
        run: npm run test:grammar

  typecheck:
    needs: build-parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the prebuilt parser
        uses: actions/download-artifact@v4
        with:
          name: pssparser-wasm
          path: packages/pssparser/ts
      - run: npm install
      # Vitest transpiles without typechecking, so type errors in test code are
      # invisible to the suites above. This is the only step that sees them --
      # and until server/tsconfig.test.json was written it saw nothing at all:
      # the script named a file that did not exist, so this step had been
      # failing rather than checking. It covers src/, test/ and bench/.
      - name: Typecheck sources and tests
        run: npm run typecheck

  test-bench:
    needs: build-parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the prebuilt parser
        uses: actions/download-artifact@v4
        with:
          name: pssparser-wasm
          path: packages/pssparser/ts
      - run: npm install
      - name: Run benchmarks
        run: npm run test:bench
