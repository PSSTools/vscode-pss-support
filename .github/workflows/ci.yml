# CI for psstools/vscode-pss-support.
#
# THE ONLY VS CODE MARKETPLACE PUBLISHER IN THE ESTATE, and the reason this
# repository is the first one converted in Phase 9. A Marketplace version is
# less recoverable than a PyPI one: PyPI lets a version be yanked, so a
# mistaken release can at least be hidden. The Marketplace has no yank -- an
# extension version, once accepted, is what users on that channel receive.
#
# Before this commit `vsce publish` was conditional on a push to master. This
# repository is about to join a five-minute bidirectional mirror, where "a push
# to master" is something a cron performs on someone else's commit. A mirror
# operation must never be a publishing operation, which is the rule this whole
# migration exists to establish.

name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------- #
  # The release-authority master switch. Resolved in its OWN job because an
  # `if:` on a job cannot reference a step in that same job, so the value has
  # to arrive through `needs.<job>.outputs`.
  #
  # A consumer that reads needs.gate.outputs WITHOUT declaring `needs: gate`
  # gets an EMPTY STRING rather than an error -- the publish condition is then
  # false forever, nothing publishes, and nothing goes red. That is the
  # quietest failure available here, so the shadow check in
  # .forgejo/workflows/ci.yml asserts the wiring explicitly.
  # ---------------------------------------------------------------------- #
  gate:
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # The python is ONE LINE on purpose: a multi-line `python3 -c` body has
        # to start at column 0, which terminates the YAML block scalar above it
        # and silently corrupts the workflow rather than failing to parse.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            # FAIL CLOSED WHEN A RELEASE COULD ACTUALLY HAPPEN, and quietly
            # otherwise. In this org a release is a `v*` TAG, so that -- not
            # the event name -- is the test. Keying on the event name would be
            # wrong in both directions: a tag push IS a push, so it would let a
            # release through unresolved, and every ordinary push would then
            # also be treated as release-critical and fail the build.
            #
            # A release blocked by a dvkit.org outage is recoverable in ten
            # minutes. A version published twice from two forges is not: PyPI
            # lets a version be yanked, never reused, and the VS Code
            # Marketplace does not even allow the yank.
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
              *)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable, and this ref cannot release; continuing"
                exit 0 ;;
            esac
          fi
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ivpm
        run: pip install ivpm
      - name: Fetch packages
        run: ivpm update -a -d default-dev -j 1
      - name: Build HTML docs
        run: packages/python/bin/sphinx-build -W --keep-going docs docs/_build/html
      # THE gh-pages DEPLOY THAT WAS HERE IS GONE, not gated.
      #
      # It fired on every push to master, with no condition beyond the branch,
      # and published to https://psstools.github.io/vscode-pss-support/ . Two
      # reasons it is deleted rather than tag-gated:
      #
      #   1. dvkit.org owns documentation for this estate. Docs are not a
      #      release -- they should publish whichever forge holds release
      #      authority -- so they go out through the Forgejo docs pipeline
      #      (an artifact this job does not hold credentials to deploy),
      #      never through a per-repo Pages site.
      #   2. Per-repo Pages sites are being retired estate-wide. Re-arming
      #      this one on a tag would resurrect a site that is on the list to
      #      be turned off.
      #
      # The Sphinx build above stays, as a CI check. It is now the only thing
      # that would notice these docs breaking, which is why the step below
      # exists: the deploy used to be the de-facto check that the build had
      # produced anything at all.
      - name: Sanity-check the docs build
        run: |
          test -s docs/_build/html/index.html \
            || { echo "::error::no index.html in the docs build output"; exit 1; }
          echo "generated pages: $(find docs/_build/html -name '*.html' | wc -l)"


  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch zuspec-fe-pss grammar
        run: git clone --depth=1 https://github.com/zuspec/zuspec-fe-pss.git packages/zuspec-fe-pss
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java (for ANTLR grammar generation)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Install dependencies
        run: npm install
      - name: Build grammar
        run: npm run build:grammar
      - name: Build
        run: npm run compile
      - name: Install vsce
        run: npm install -g @vscode/vsce
      - name: Package extension
        run: vsce package
      - name: Check the tag matches the package version
        # Only on a tag, and BEFORE the publish step, because `vsce publish`
        # takes its version from package.json and ignores the tag entirely.
        # Tagging v0.4.0 while package.json still says 0.3.0 would publish
        # 0.3.0 under the name of a release that is not it -- and, the
        # Marketplace having no yank, that is not correctable afterwards.
        #
        # It CHECKS rather than rewrites, deliberately. A rewrite makes the
        # published artifact differ from the commit it claims to be built
        # from; for an extension shipped to users, the committed version is
        # the thing that should be authoritative.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match version $pkg in package.json"
            exit 1
          fi

      - name: Publish to VS Code Marketplace
        # WAS: `github.event_name == 'push' && github.ref == 'refs/heads/master'`
        #
        # Both halves are required and neither is redundant:
        #
        #   startsWith(github.ref, 'refs/tags/v')  -- a release is a deliberate
        #     tag, never a branch push, so no mirrored commit can trigger one.
        #   needs.gate.outputs.authority == 'github'  -- the master switch at
        #     https://dvkit.org/.well-known/release-authority.json decides
        #     WHICH forge releases this repo. Flipping it in sync-policy.toml
        #     moves the release with no edit to this file.
        #
        # `needs: gate` is declared on the job above. Without it this
        # expression reads an empty string, is false forever, and publishes
        # nothing while going green -- see the note on the gate job.
        if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.authority == 'github' }}
        env:
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VS_MARKETPLACE_PAT is not set for this repository"
            exit 1
          fi
          vsce publish -p "$VSCE_PAT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ivpm
        run: pip install ivpm
      - name: Fetch packages
        run: ivpm update -a -d default-dev -j 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint

  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run core tests
        run: npm run test:core

  test-lsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run LSP tests
        run: npm run test:lsp

  test-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run benchmarks
        run: npm run test:bench
