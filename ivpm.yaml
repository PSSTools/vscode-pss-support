package:
  name: vscode-pss-support

  # PREBUILT IS THE DEFAULT. A bare `ivpm update`, and therefore a new
  # contributor's first bootstrap, gets the published parser and never installs
  # Emscripten. Opting into the source build is `-d source-dev`, below.
  default-dep-set: default-dev

  with:
    node:
      # No <project_root>/node_modules symlink into packages/node/node_modules.
      #
      # IVPM's default is to create that link, because for most projects it is
      # the only way project sources can import an IVPM-managed package: node
      # resolves bare specifiers by walking `node_modules` *upward* and never
      # looks sideways into packages/node/.
      #
      # Here it would be actively destructive. This repo has its own root
      # package.json and runs `npm install` at the root, so npm would treat the
      # symlinked tree as its own -- and npm prunes packages that are not in the
      # manifest it is installing. The first root `npm install` after an
      # `ivpm update` would delete @psstools/pssparser out from under the
      # server. server/package.json names the package directly instead, so the
      # link buys nothing to offset that.
      #
      # THIS IS ALSO WHY THE SWITCH BELOW IS NOT PURELY AN IVPM MATTER. Because
      # the managed node environment is off the server's resolution path, what
      # `import "@psstools/pssparser"` finds is decided by server/node_modules,
      # which npm populates from server/package.json. IVPM chooses whether the
      # SOURCE TREE is fetched and built; `npm run use:source` chooses which of
      # the two the server resolves. See the note on those scripts in
      # package.json.
      link-root: false

  # ---------------------------------------------------------------------- #
  # TWO DEP-SETS, AND THEY DUPLICATE RATHER THAN INHERIT. IVPM dep-sets have no
  # `extends`: a dep-set is exactly its own `deps` list. The shared entries are
  # therefore repeated in both, and adding a dependency means adding it twice.
  # That is the format, not an oversight -- but it is the failure mode to watch,
  # because a dep added to only one set produces a difference that shows up as
  # "works in prebuilt, broken in source" rather than as a missing package.
  # ---------------------------------------------------------------------- #
  dep-sets:

  # ====================================================================== #
  # PREBUILT (default). The server resolves @psstools/pssparser from the npm
  # registry through server/package.json; nothing here builds a parser.
  #
  # NOTE WHAT IS ABSENT: the pssparser source recipe. It is not merely
  # unnecessary here, it is the entire cost being avoided -- an ivpm fetch, a
  # JDK, the pinned Emscripten toolchain and a C++ compile, about five minutes.
  # ====================================================================== #
  - name: default-dev
    deps:
    # ALWAYS SPELL DEPENDENCIES AS github.com URLs. This manifest is public --
    # it ships in the repo, which is mirrored to GitHub and published to
    # git.dvkit.org -- so it has to name a URL that an outside collaborator can
    # actually clone. On a developer machine IVPM's site config remaps this to
    # the local Forgejo mirror before auth is applied, so naming GitHub costs
    # nothing here and is the only form that works everywhere.
    #
    # LOWERCASE `psstools`, DELIBERATELY. GitHub's canonical spelling of the org
    # is `PSSTools` and it will happily serve either, but the site-config remap
    # is a literal prefix match: `github.com/psstools/` is mapped and
    # `github.com/PSSTools/` is not. The mixed-case form silently bypasses the
    # mirror and clones from GitHub instead -- which works, and is therefore the
    # kind of thing nobody notices until the mirror and GitHub disagree.
    - name: pssfmt
      url: https://github.com/psstools/pssfmt.git

    # docs/conf.py hardcodes `html_theme = 'sphinx_rtd_theme'`, and the CI docs
    # job builds with `-W`, so a missing theme is a hard failure. Declared
    # explicitly so the docs build depends on something stated rather than
    # something inherited.
    - name: sphinx-rtd-theme
      src: pypi

    # SPHINX ITSELF, EXPLICITLY, and only newly so. It used to arrive down a
    # four-link transitive chain -- root -> pssparser -> pyastbuilder -> sphinx
    # -- and this dep-set is precisely the one that no longer declares
    # pssparser. `ivpm show deps` still shows a second path to it (pssfmt ->
    # sphinx-pss), so dropping it silently happens to keep working, which is
    # the worst of the available outcomes: the docs job would depend on which
    # unrelated package happened to pull Sphinx in. Same reasoning as the theme
    # above, and the same reasoning that put the theme there.
    - name: sphinx
      src: pypi

  # ====================================================================== #
  # SOURCE BUILD. Adds the pssparser source recipe on top of the same deps.
  #
  #   ivpm update -a -d source-dev -j 1 && npm install && npm run use:source
  #
  # `use:source` is the second half and is not optional: this dep-set builds
  # the parser into packages/pssparser/ts/dist, but server/package.json still
  # names the published range, so without it the server keeps resolving the
  # registry copy and the source build sits unused. See package.json.
  # ====================================================================== #
  - name: source-dev
    deps:
    - name: pssfmt
      url: https://github.com/psstools/pssfmt.git
      # EXPLICIT, and it is not optional here the way it is in default-dev.
      # A dependency entry naming no `dep-set` inherits THE NAME OF THE SET
      # THAT DECLARES IT -- so this entry asks pssfmt for a `source-dev`, and
      # pssfmt declares only `default`/`default-dev`. In default-dev the same
      # entry inherits `default-dev` and resolves by coincidence of naming,
      # which is why the two copies of this dependency are not interchangeable
      # and why only the canary -- the one job that passes `-d source-dev` --
      # went red on it:
      #
      #   fatal: package 'pssfmt' does not contain dep-set 'source-dev'
      #
      # This is the "added to only one set" failure the header above warns
      # about, arriving in its other shape: present in both, resolvable in one.
      dep-set: default-dev

    - name: sphinx-rtd-theme
      src: pypi

    # Not repeated from default-dev's reasoning: here pssparser IS declared, so
    # the root -> pssparser -> pyastbuilder -> sphinx chain exists again. Kept
    # explicit anyway so the two dep-sets resolve Sphinx the same way rather
    # than one inheriting it and one declaring it.
    - name: sphinx
      src: pypi

    - name: pssparser
      url: https://github.com/psstools/pssparser.git
      anonymous: true
      # Redundant with the `-a` that CI passes to `ivpm update`, and kept anyway:
      # the per-package value is OR'd with the command-line flag, so this is what
      # makes a bare `ivpm update` work for someone who does not know to pass it.
      # Without anonymous auth IVPM's default order is ['gh', 'ssh'], which needs
      # a credential this repo's CI does not hold.
      #
      # The parser is consumed as a WebAssembly npm package built from source:
      # pssparser's ts/ directory is installed into the managed node
      # environment as a `file:` dependency, and npm's `prepare` hook compiles
      # the C++ core to wasm and emits dist/ on install.
      #
      # This is the recipe pssparser's own ivpm.yaml documents for source
      # consumers; the three keys are not independent.
      #
      #   dep-set: ts-build   default-dev (astbuilder, ANTLR, the venv) plus
      #                       the pinned Emscripten toolchain. Building the
      #                       wasm needs emcc, and default-dev does not carry
      #                       it, so the plain dep-set gets as far as `emcmake:
      #                       not found`.
      #
      #   deps-mode: nested   pssparser's dependencies land in *its* deps-dir
      #                       rather than being flattened into ours.
      #                       wasm/CMakeLists.txt resolves ANTLR relative to
      #                       its own tree, so flattened it finds nothing.
      #
      #   subdir: ts          the package.json is in ts/, not at the repo root.
      #                       Without it npm is handed a directory with no
      #                       manifest, symlinks it anyway, and *succeeds* --
      #                       the package is simply not importable afterwards.
      dep-set: ts-build
      deps-mode: nested
      #
      # `raw` alongside `node` is not redundant. pssparser has a pyproject.toml
      # at its root, and IVPM's python auto-detection is *additive*: declaring
      # a node type does not opt out of it. Without `raw` here, IVPM enrols
      # pssparser as a python package as well and tries to build the native
      # Cython extension -- which needs a full C++ toolchain and a cmake
      # configure, fails, and takes the whole update down. `raw` is how a
      # dependency says "no python content"; it does not suppress the node
      # type declared beside it.
      #
      # This only shows up on a *clean* bootstrap. In a warm workspace the
      # extension is already installed and the python step is a no-op, so the
      # node-only form appears to work right up until CI runs it.
      type: [raw, { node: { subdir: ts } }]
